<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bloqueado</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a6c1ee);
      background-size: 400% 400%;
      animation: fondo 10s ease infinite;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      text-align: center;
      color: #333;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: bold;
      color: #ff0000;
      margin-bottom: 200px;
      animation: bounce 1.5s infinite;
    }
    p {
      font-size: 1.8rem;
      font-weight: bold;
      color: #444;
      background: #fff8c6;
      padding: 15px 25px;
      border-radius: 12px;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
      max-width: 800px;
      animation: fadeIn 2s;
      margin-top: -150px; /* sube el mensaje aleatorio */
    }
    @keyframes fondo {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-20px); }
      60% { transform: translateY(-10px); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>🚀🎶TE AMAMOS Y NECESITAMOS AYUDARTE🎶🚀</h1>
  <p id="mensaje">Cargando mensaje...</p>

  <script src="blocked.js"></script>
</body>
</html>
